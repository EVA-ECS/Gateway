name: .NET PR Tests

on:
    pull_request:
        branches: ["dev"]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup .NET 8
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x
                  source-url: https://nuget.pkg.github.com/EVA-ECS/index.json
              env:
                  NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Authenticate specific NuGet URL
              run: dotnet nuget add source "https://nuget.pkg.github.com/EVA-ECS/download/eva_ecs.chat.contracts/index.json" --name "EVA-Chat-Contracts" --username "github-actions" --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text
              continue-on-error: true

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore --configuration Release

            - name: Test
              run: dotnet test --no-build --configuration Release --verbosity normal
